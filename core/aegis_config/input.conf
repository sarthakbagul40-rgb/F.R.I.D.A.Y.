# F.R.I.D.A.Y. PROJECT A.E.G.I.S. Universal Keybinds (OTT Streaming Platform Hybrid)
SPACE cycle pause
k cycle pause
p cycle pause
RIGHT seek 10 exact
LEFT seek -10 exact
l seek 10 exact
j seek -10 exact
SHIFT+RIGHT seek 60 exact
SHIFT+LEFT seek -60 exact
UP add volume 5
DOWN add volume -5
m cycle mute
f cycle fullscreen
q quit
# Subtitles & Captions
c cycle sub-visibility
v cycle sub-visibility
s cycle sub
# Audio Tracks & Languages
a cycle audio
Ctrl+a cycle audio
# Episode Navigation (Binge Auto-Play)
n set user-data/cmd "next_episode"; show-text "⏭ Advancing to next episode..." 2500
b set user-data/cmd "prev_episode"; show-text "⏮ Rewinding to previous episode..." 2500
# Quality Selection
Ctrl+1 write-watch-later-config; set ytdl-format "bestvideo[height<=1080]+bestaudio/best"; loadfile "${path}"; show-text "Stream Quality: 1080p Full HD" 3000
Ctrl+2 write-watch-later-config; set ytdl-format "bestvideo[height<=720]+bestaudio/best"; loadfile "${path}"; show-text "Stream Quality: 720p HD" 3000
Ctrl+3 write-watch-later-config; set ytdl-format "bestvideo[height<=480]+bestaudio/best"; loadfile "${path}"; show-text "Stream Quality: 480p Standard" 3000
# Modern OTT HUD Help Overlay
h show-text "F.R.I.D.A.Y. OTT Player Controls:\nSPACE/K: Pause | C: Captions | S: Subtitles | A: Audio Track\nN: Next Ep | B: Prev Ep | Ctrl+1/2/3: 1080p/720p/480p\nF: Fullscreen | M: Mute | UP/DOWN: Volume" 6000
? show-text "F.R.I.D.A.Y. OTT Player Controls:\nSPACE/K: Pause | C: Captions | S: Subtitles | A: Audio Track\nN: Next Ep | B: Prev Ep | Ctrl+1/2/3: 1080p/720p/480p\nF: Fullscreen | M: Mute | UP/DOWN: Volume" 6000
# Mouse Controls
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
